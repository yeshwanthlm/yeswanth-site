name: Deploy to S3 + CloudFront

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Deploy HTML, CSS, JS — short cache so updates are seen quickly
      - name: Upload HTML / CSS / JS
        run: |
          aws s3 sync src/ s3://${{ secrets.S3_BUCKET }}/ \
            --exclude "*" \
            --include "*.html" \
            --include "*.css" \
            --include "*.js" \
            --cache-control "max-age=300, must-revalidate" \
            --delete

      # Deploy assets — long cache, they rarely change
      - name: Upload assets (images, logos)
        run: |
          aws s3 sync assets/ s3://${{ secrets.S3_BUCKET }}/assets/ \
            --cache-control "max-age=31536000, immutable" \
            --delete

      # Deploy speaking events data + images
      - name: Upload speaking events
        run: |
          aws s3 sync speaking-events/ s3://${{ secrets.S3_BUCKET }}/speaking-events/ \
            --exclude ".DS_Store" \
            --cache-control "max-age=300, must-revalidate" \
            --delete

      # Bust CloudFront cache so visitors see changes immediately
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Deployment summary
        run: |
          echo "✅ Deployed successfully!"
          echo "🌐 Site: https://yeshwanthlm.in"
          echo "📦 S3 Bucket: ${{ secrets.S3_BUCKET }}"
          echo "⚡ CloudFront cache invalidated"
